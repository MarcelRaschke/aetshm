# SonarQube / SonarCloud analysis
#
# Voraussetzungen (Settings > Secrets and variables > Actions):
#   Secret   SONAR_TOKEN        Token aus SonarQube (My Account > Security) bzw. https://sonarcloud.io/account/security
#   Secret   SONAR_HOST_URL     z.B. https://sonarcloud.io oder URL der eigenen Instanz
#   Variable SONAR_PROJECT_KEY  Project Key (Fallback: MarcelRaschke_aetshm)
#   Variable SONAR_ORGANIZATION optional, nur fuer SonarCloud
#
# Fehlt SONAR_TOKEN (Fork-PR, Dependabot, noch nicht konfiguriert), wird der Scan
# mit Warnung uebersprungen statt den Job fehlschlagen zu lassen.

name: SonarQube analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Analysis:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # volle History fuer Blame und New-Code-Erkennung

      - name: Analyze with SonarQube
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'MarcelRaschke_aetshm' }}
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=SonarQube::SONAR_TOKEN nicht verfuegbar (Fork-PR, Dependabot oder nicht konfiguriert) - Scan uebersprungen."
